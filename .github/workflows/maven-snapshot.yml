name: Publish Snapshot to Maven Central

on:
  push:
    branches:
      - main
      - 'zorrobpm-50-*' # TEMPORARY: verification of ZORROBPM-50, remove before merge
  workflow_dispatch:

# One publication per branch at a time; a newer push waits and supersedes queued ones.
concurrency:
  group: maven-snapshot-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'corretto'
          cache: maven
          server-id: central
          server-username: MAVEN_CENTRAL_USERNAME
          server-password: MAVEN_CENTRAL_PASSWORD
          gpg-private-key: ${{ secrets.MAVEN_GPG_PRIVATE_KEY }}
          gpg-passphrase: MAVEN_GPG_PASSPHRASE

      - name: Verify version is SNAPSHOT
        run: |
          VERSION=$(mvn -q -Dexec.executable=echo -Dexec.args='${project.version}' --non-recursive exec:exec)
          echo "Project version: $VERSION"
          if [[ "$VERSION" != *-SNAPSHOT ]]; then
            echo "::error::Snapshot publishing accepts only -SNAPSHOT versions, got $VERSION. Releases are published by pushing a v* tag."
            exit 1
          fi

      - name: Build and test all modules
        run: mvn -B install

      - name: Publish snapshot of each module
        run: bash .github/scripts/publish-modules.sh
        env:
          MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.MAVEN_GPG_PASSPHRASE }}
